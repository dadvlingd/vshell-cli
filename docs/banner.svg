<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="vshell-cli — VShell C2 command line client">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="110" cy="60" r="96" fill="#3ddc84" opacity="0.10" filter="url(#glow)"/>
  <circle cx="560" cy="300" r="110" fill="#22b8cf" opacity="0.08" filter="url(#glow)"/>

  <text x="64" y="84" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#7dd3fc">VSHELL C2 · COMMAND LINE CLIENT</text>

  <text x="62" y="164" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="62" font-weight="700" fill="#f8fafc">vshell-cli</text>
  <rect x="64" y="184" width="132" height="6" rx="3" fill="url(#accent)"/>

  <text x="64" y="226" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" fill="#a8b3c7">账号密码登录，一个二进制完成 Agent 管理、文件操作与 SOCKS5 隧道</text>

  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13">
    <rect x="64" y="250" width="92" height="30" rx="15" fill="#14213a" stroke="#243554"/>
    <text x="110" y="270" text-anchor="middle" fill="#8ee6b0">Agents</text>
    <rect x="166" y="250" width="80" height="30" rx="15" fill="#14213a" stroke="#243554"/>
    <text x="206" y="270" text-anchor="middle" fill="#8ee6b0">Files</text>
    <rect x="256" y="250" width="96" height="30" rx="15" fill="#14213a" stroke="#243554"/>
    <text x="304" y="270" text-anchor="middle" fill="#8ee6b0">Tunnel</text>
    <rect x="362" y="250" width="82" height="30" rx="15" fill="#14213a" stroke="#243554"/>
    <text x="403" y="270" text-anchor="middle" fill="#8ee6b0">Shell</text>
  </g>

  <g>
    <rect x="676" y="44" width="460" height="232" rx="14" fill="#080d18" stroke="#22304c"/>
    <rect x="676" y="44" width="460" height="34" rx="14" fill="#0d1526"/>
    <rect x="676" y="64" width="460" height="14" fill="#0d1526"/>
    <circle cx="698" cy="61" r="5" fill="#ff5f57"/>
    <circle cx="716" cy="61" r="5" fill="#febc2e"/>
    <circle cx="734" cy="61" r="5" fill="#28c840"/>
    <text x="1090" y="66" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#5b6b86">zsh</text>

    <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14">
      <text x="700" y="108" fill="#5b6b86">$</text>
      <text x="722" y="108" fill="#e2e8f0">vshell-cli info</text>
      <text x="700" y="134" fill="#8ee6b0">VShell C2 运行中</text>
      <text x="700" y="156" fill="#94a3b8">  在线 Agent: 12</text>
      <text x="700" y="184" fill="#5b6b86">$</text>
      <text x="722" y="184" fill="#e2e8f0">vshell-cli shell 4</text>
      <text x="700" y="210" fill="#7dd3fc">agent-4:/root&gt;</text>
      <text x="828" y="210" fill="#e2e8f0">whoami</text>
      <text x="700" y="236" fill="#e2e8f0">root</text>
      <text x="700" y="262" fill="#7dd3fc">agent-4:/root&gt;</text>
      <rect x="828" y="248" width="9" height="17" fill="#3ddc84"/>
    </g>
  </g>
</svg>
